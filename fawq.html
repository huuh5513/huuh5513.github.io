*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--oil);color:var(--cream);font-family:var(--modern);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
[hidden]{display:none!important}

/* ---------- STAGE ---------- */
.stage{position:relative;height:100vh;height:100svh;min-height:560px;display:grid;grid-template-rows:1fr 1fr;overflow:hidden}
.half{all:unset;position:relative;display:block;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent}
.half:focus-visible{outline:3px solid var(--gold);outline-offset:-6px}
.half .inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;transition:transform .9s cubic-bezier(.2,.7,.2,1),opacity .6s}
.up{background:var(--oil)}
.up .art{position:absolute;inset:0;background:var(--paint) center 62%/cover no-repeat;transform:scale(1.06);transition:transform 1.4s cubic-bezier(.2,.7,.2,1),filter .6s}
.up::after{content:"";position:absolute;inset:0;background:
  radial-gradient(120% 90% at 50% 70%,transparent 30%,rgba(10,6,3,.55) 75%),
  linear-gradient(180deg,rgba(10,6,3,.82) 0%,rgba(10,6,3,.2) 38%,transparent 60%,rgba(10,6,3,.35) 100%)}
.up .inner{z-index:2;justify-content:flex-start;padding-top:calc(env(safe-area-inset-top,0px) + 5.5vh)}
.word{display:block;line-height:1.15;margin:0;font-weight:700;letter-spacing:0}
.up .word{padding:.05em .12em .28em;margin-bottom:-.22em;font-family:var(--classic);font-size:clamp(68px,21vw,190px);color:var(--gold);text-shadow:0 2px 30px rgba(0,0,0,.6);
  background:linear-gradient(180deg,#f1d79c 10%,#c99a4d 60%,#8f6528 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.cap{display:block;margin:.6em 0 0;font-size:clamp(13px,3.6vw,16px);letter-spacing:.01em}
.up .cap{font-family:var(--classic);font-style:italic;font-size:clamp(16px,4.4vw,20px);color:#e9d9b8;opacity:.9}

.down{background:var(--wall)}
.down::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 70% at 50% 35%,rgba(255,255,255,.55),transparent 70%);pointer-events:none}
.down .inner{z-index:2;justify-content:flex-end;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 3.5vh)}

  box-shadow:0 10px 24px rgba(60,48,36,.22),0 1px 2px rgba(60,48,36,.2);transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.down .word{font-family:var(--modern);font-weight:700;font-size:clamp(64px,19vw,176px);color:var(--ink);letter-spacing:-.01em}
.down .cap{color:var(--ash);margin-top:.4em}

.pill{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:11px 20px;border-radius:99px;font-family:var(--modern);font-size:15px;font-weight:600;line-height:1;animation:nudge 2.4s ease-in-out infinite}
.pill i{font-style:normal;font-size:16px}
.pill-up{background:linear-gradient(180deg,#f1d79c,#c49548);color:#1a1008;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.pill-down{background:var(--ink);color:#fff;box-shadow:0 8px 22px rgba(20,18,16,.25);animation-delay:1.2s}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
/* rope */
.rope{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:3;pointer-events:none;width:min(100%,820px);height:100%}
.knot{position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 22px 12px;border-radius:99px;white-space:nowrap;
  display:grid;place-items:center;font-family:var(--classic);font-weight:700;font-size:clamp(20px,5.6vw,26px);line-height:1.2;color:var(--oil);
  background:radial-gradient(circle at 35% 30%,#f4dca7,#b88a45 65%,#6d4c1f);box-shadow:0 6px 20px rgba(0,0,0,.45),inset 0 -3px 6px rgba(0,0,0,.25);pointer-events:none}
.brand{position:absolute;z-index:5;top:calc(env(safe-area-inset-top,0px) + 14px);inset-inline:0;display:flex;justify-content:space-between;padding-inline:18px;
  font-size:11px;letter-spacing:.08em;color:rgba(242,233,216,.62);pointer-events:none}
.hint b{font-weight:600}
.hint{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,calc(-50% + 50px));font-size:13px;color:#2a2622;background:rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(0,0,0,.12);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:6px 14px;border-radius:99px;white-space:nowrap;pointer-events:none;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.8}}

/* hover / choose states */
@media (hover:hover){
  .stage:has(.up:hover) .up .art{transform:scale(1.02)}
  .stage:has(.up:hover) .down .inner{opacity:.55}
  .stage:has(.down:hover) .banana{transform:translate(-50%,-50%) rotate(-1deg) scale(1.05)}
  .stage:has(.down:hover) .up .inner,.stage:has(.down:hover) .up .art{opacity:.55}
}
.stage.pick-up .down .inner,.stage.pick-up .banana{opacity:.25}
.stage.pick-down .up .inner,.stage.pick-down .up .art{opacity:.25}

/* ---------- SHEET ---------- */
.sheet{position:fixed;z-index:20;inset-inline:0;bottom:0;padding:22px 20px calc(env(safe-area-inset-bottom,0px) + 22px);
  background:rgba(250,247,242,.92);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);
  color:var(--ink);border-radius:26px 26px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);transform:translateY(110%);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.sheet-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-size:22px;font-weight:600}
.sheet p{margin:0;color:var(--ash);font-size:14px;line-height:1.7}
.row{display:flex;gap:10px}
.btn{flex:1;min-height:52px;border:0;border-radius:16px;cursor:pointer;font-size:16px;font-weight:600;transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--ink);color:#fff}
.btn.ghost{background:rgba(20,18,16,.07)}
.btn[disabled]{opacity:.5;cursor:default}

/* ---------- RESULT ---------- */
.result{min-height:100vh;min-height:100svh;position:relative;overflow:hidden}
.result .bg{position:absolute;inset:0;z-index:0}
.is-up .result{background:var(--oil);color:var(--cream)}
.is-up .result .bg{background:var(--paint) center 62%/cover;opacity:.22;filter:blur(2px) saturate(.8);transform:scale(1.1)}
.is-down .result{background:var(--wall);color:var(--ink)}
.is-down .result .bg{background:radial-gradient(80% 50% at 50% 0%,rgba(255,255,255,.7),transparent 70%)}
.is-down{background:var(--wall)}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 56px) 22px calc(env(safe-area-inset-bottom,0px) + 48px);display:flex;flex-direction:column;gap:34px}
.reveal{opacity:0;transform:translateY(18px);animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.eyebrow{margin:0;font-size:13px;letter-spacing:.06em;opacity:.7}
.is-up .eyebrow{color:var(--gold)}
.big{margin:0;display:flex;flex-direction:column;gap:10px}
.big .n{font-variant-numeric:tabular-nums;line-height:1.1;padding:.05em .08em .2em;margin-bottom:-.2em;font-weight:700;font-size:clamp(96px,30vw,180px)}
.is-up .big .n{font-family:var(--classic);background:linear-gradient(180deg,#f1d79c,#b3843d);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.is-down .big .n{font-family:var(--modern);letter-spacing:-.03em}
.big .t{font-size:clamp(20px,5.6vw,28px);font-weight:400;line-height:1.35}
.is-up .big .t{font-family:var(--classic);font-size:clamp(24px,6.6vw,32px)}
.share{margin:-14px 0 0;font-size:15px;opacity:.75;line-height:1.7}

.tally{display:flex;flex-direction:column;gap:14px}
.tl{display:grid;grid-template-columns:78px 1fr auto;align-items:center;gap:12px;font-variant-numeric:tabular-nums}
.tl .lab{font-size:15px;font-weight:600;white-space:nowrap}
.tl .lab.c{font-family:var(--classic);font-size:19px}
.tl .val{font-size:15px;min-width:3ch;text-align:left}
.track{height:12px;border-radius:99px;background:rgba(128,120,110,.18);overflow:hidden}
.fill{height:100%;width:0;border-radius:99px;transition:width 1.6s cubic-bezier(.2,.7,.2,1) .3s}
.fill.c{background:repeating-linear-gradient(-55deg,#ecd29b 0 6px,#b98f4f 6px 10px)}
.fill.m{background:repeating-linear-gradient(-30deg,#7d756c 0 3px,#5d564f 3px 4px,#8a8279 4px 9px)}
.tl.mine .lab::after{content:" · أنت";font-size:11px;font-weight:400;opacity:.6;font-family:var(--modern)}
.note{font-size:12px;opacity:.6;margin:-20px 0 0;line-height:1.7}

/* wisdom cards */
.card{position:relative;padding:30px 26px 24px;border-radius:4px}
.card .k{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.1em;margin:0 0 14px}
.card .k::before{content:"";width:26px;height:1px;background:currentColor;opacity:.6}
.card blockquote{margin:0;line-height:1.75;text-wrap:balance}
.card .no{margin:18px 0 0;font-size:11px;opacity:.55;font-variant-numeric:tabular-nums}
.is-up .card{background:linear-gradient(180deg,#f6efe1,#ece2cd);color:#2a1d10;box-shadow:0 0 0 1px #c9a868,0 0 0 7px #2a1a0e,0 0 0 8px #8f6a30,0 24px 50px rgba(0,0,0,.5)}
.is-up .card .k{color:#8f6528}
.is-up .card blockquote{font-family:var(--classic);font-size:clamp(23px,6.2vw,30px)}
.is-down .card{background:#fff;color:var(--ink);box-shadow:0 18px 40px rgba(60,50,40,.16);margin-top:10px}
.is-down .card::before,.is-down .card::after{content:"";position:absolute;top:-12px;width:96px;height:30px;background:linear-gradient(180deg,#b8bcc1,#9ea2a7);opacity:.95;
  clip-path:polygon(0 8%,6% 0,12% 10%,18% 0,24% 8%,76% 4%,82% 12%,88% 0,94% 10%,100% 2%,100% 92%,94% 100%,88% 90%,82% 100%,76% 92%,24% 96%,18% 88%,12% 100%,6% 90%,0 100%)}
.is-down .card::before{right:-6px;transform:rotate(32deg)}
.is-down .card::after{left:-6px;transform:rotate(-32deg)}
.is-down .card .k{color:var(--ash)}
.is-down .card blockquote{font-size:clamp(20px,5.4vw,25px);font-weight:400}

.more{all:unset;cursor:pointer;align-self:center;margin-top:-14px;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;border:1px solid currentColor;opacity:.8}
.more:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.foot{display:flex;flex-direction:column;gap:6px;font-size:12px;opacity:.6;line-height:1.7;border-top:1px solid currentColor;border-color:rgba(128,120,110,.3);padding-top:18px}
.foot b{font-weight:600}
.again{all:unset;cursor:pointer;font-size:12px;text-decoration:underline;text-underline-offset:3px;opacity:.7;align-self:flex-start}

/* ---------- QR POSTER & LIVE ---------- */
.poster,.live{min-height:100vh;min-height:100svh;background:var(--wall);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:40px 22px;text-align:center}
.poster h1{margin:0;font-family:var(--classic);font-size:clamp(44px,11vw,72px);line-height:1}
.poster h1 span{font-family:var(--modern);font-weight:700}
.qrbox{background:#fff;padding:18px;border-radius:18px;box-shadow:0 18px 40px rgba(60,50,40,.18)}
.qrbox img,.qrbox canvas{display:block;width:min(64vw,300px)!important;height:auto!important}
.poster p{margin:0;color:var(--ash);font-size:15px;line-height:1.7}
.poster small{color:var(--ash);font-size:11px;word-break:break-all;max-width:320px}
.live{background:var(--oil);color:var(--cream);gap:30px}
.live h1{margin:0;font-family:var(--classic);font-size:clamp(36px,6vw,64px);color:var(--gold)}
.duo{display:flex;gap:min(10vw,120px);align-items:flex-end;flex-wrap:wrap;justify-content:center}
.duo div{display:flex;flex-direction:column;gap:6px;align-items:center}
.duo .n{font-size:clamp(70px,14vw,200px);font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.duo .c .n{font-family:var(--classic);color:var(--gold)}
.duo .m .n{color:#fff}
.duo span{font-size:18px;opacity:.7}
.live .track{width:min(80vw,900px);height:16px}

@media (min-width:900px){
  .up .inner{padding-top:9vh}
  .banana{width:170px;top:36%}
  .down .word{font-size:132px}
  .up .word{font-size:150px}
}

/* ---------- REAL PAINTING STAGE (v2) ---------- */
.stage{grid-template-rows:46fr 54fr;background:var(--paint) center -11svh/auto 100svh no-repeat,linear-gradient(180deg,#1b130c 0 46%,#cfc2ad 46% 100%)}
.up,.down{background:transparent}
.up .art,.rope{display:none}
.up::after{background:linear-gradient(180deg,rgba(10,6,3,.72) 0%,rgba(10,6,3,.25) 22%,transparent 40%)}
.down::before{display:none}
.down::after{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(180deg,transparent,rgba(214,203,186,.85));pointer-events:none}
.up .inner{padding-top:calc(env(safe-area-inset-top,0px) + 4svh)}
.up .word{font-size:9.5svh}
.down .word{font-size:8.5svh}
.pill{margin-top:1.2svh;padding:1.2svh 2.4svh;font-size:clamp(13px,1.9svh,16px)}
.down .inner{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 2.4svh)}
.knot{top:46%}
.banana{top:20.5svh;left:calc(50% + .6svh);width:16svh;transform:translate(-50%,0) rotate(-3deg)}
.stage:has(.down:hover) .banana{transform:translate(-50%,0) rotate(-1deg) scale(1.04)}
.brand{color:rgba(242,233,216,.75)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>

<main id="stage" class="stage" aria-label="صوّت: فوق أم تحت">
  <div class="brand"><span>حسام فودة</span><span>عمل تفاعلي · ٢٠٢٦</span></div>

  <button class="half up" id="pick-up" data-side="up" aria-label="فوق: الفن كما كان">
    <span class="art" aria-hidden="true"></span>
    <span class="inner">
      <span class="word">فوق</span>
      <span class="pill pill-up">صوّت لـ «فوق» <i aria-hidden="true">↑</i></span>
    </span>
  </button>

  <button class="half down" id="pick-down" data-side="down" aria-label="تحت: الفن كما صار">
    <span class="banana" aria-hidden="true"></span>
    <span class="inner">
      <span class="word">تحت</span>
      <span class="pill pill-down">صوّت لـ «تحت» <i aria-hidden="true">↓</i></span>
    </span>
  </button>

  <svg class="rope" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0d69d"/><stop offset="1" stop-color="#b48a47"/></linearGradient>
    </defs>
    <g fill="none" stroke-linecap="round" vector-effect="non-scaling-stroke">
      <path d="M2 34 L50 50 M98 34 L50 50" stroke="url(#g)" stroke-width="7" vector-effect="non-scaling-stroke"/>
      <path d="M2 34 L50 50 M98 34 L50 50" stroke="#7d5a2a" stroke-width="7" stroke-dasharray="2 5" vector-effect="non-scaling-stroke" opacity=".7"/>
      <path d="M50 50 L46.5 54 L48 56 L43 60 L44.5 62 L38 66.5" stroke="#5a524a" stroke-width="3.5" vector-effect="non-scaling-stroke"/>
      <path d="M50 50 L53.5 54 L52 56 L57 60 L55.5 62 L62 66.5" stroke="#5a524a" stroke-width="3.5" vector-effect="non-scaling-stroke"/>
      <path d="M50.6 51 L47 57 L45 61 L39 66 M49.4 51 L53 57 L55 61 L61 66" stroke="#5a524a" stroke-width="1.5" vector-effect="non-scaling-stroke" opacity=".6"/>
    </g>
  </svg>
  <div class="knot" aria-hidden="true">أيّهما الفن؟</div>
  <div class="hint" id="hint" hidden></div>
</main>

<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet-in">
    <h2 id="sheet-title">اخترت «فوق»</h2>
    <p id="sheet-text">لكل شخص صوت واحد.</p>
    <div class="row">
      <button class="btn primary" id="confirm">ثبّت صوتي</button>
      <button class="btn ghost" id="cancel">رجوع</button>
    </div>
  </div>
</section>

<section class="result" id="result" hidden aria-live="polite">
  <div class="bg" aria-hidden="true"></div>
  <div class="wrap">
    <p class="eyebrow reveal" id="r-eyebrow"></p>
    <h1 class="big reveal" style="animation-delay:.1s"><span class="n" id="r-n">٠</span><span class="t" id="r-t"></span></h1>
    <p class="share reveal" style="animation-delay:.2s" id="r-share"></p>

    <div class="tally reveal" style="animation-delay:.35s">
      <div class="tl" id="tl-up"><span class="lab c">فوق</span><div class="track"><div class="fill c" id="f-up"></div></div><span class="val" id="v-up">—</span></div>
      <div class="tl" id="tl-down"><span class="lab">تحت</span><div class="track"><div class="fill m" id="f-down"></div></div><span class="val" id="v-down">—</span></div>
    </div>
    <p class="note reveal" style="animation-delay:.4s" id="r-note"></p>

    <article class="card reveal" style="animation-delay:.6s">
      <p class="k">رسالة لك</p>
      <blockquote id="r-wisdom"></blockquote>
      <p class="no" id="r-no"></p>
    </article>

    <div class="foot reveal" style="animation-delay:.8s">
      <span><b>فوق أم تحت؟</b> · حسام فودة، ٢٠٢٦</span>
      <span>لوحة أخذت أيامًا، وموزة أخذت ثواني. وأنت قرّرت أيّهما الفن.</span>
      <button class="again" id="again" hidden>العودة إلى العمل</button>
    </div>
  </div>
</section>

<section class="poster" id="poster" hidden>
  <h1>فوق <span>أم</span> تحت؟</h1>
  <div class="qrbox"><div id="qr"></div></div>
  <p>امسح الرمز، اختر، واعرف كم شخصًا يتفق معك.</p>
  <small id="qr-url"></small>
</section>

<section class="live" id="live" hidden>
  <h1>فوق أم تحت؟</h1>
  <div class="duo">
    <div class="c"><span class="n" id="l-up">٠</span><span>فوق</span></div>
    <div class="m"><span class="n" id="l-down">٠</span><span>تحت</span></div>
  </div>
  <div class="track"><div class="fill c" id="l-fill" style="width:50%"></div></div>
</section>

<script>
(function(){
  "use strict";
  var API = "https://abacus.jasoncameron.dev";
  var NS = "fawqtaht-hfodah-official";

"اخترت المستقبل، والمستقبل يحب اللي يفهمونه بدري.", "فيك قدرة تشوف الفرصة في المكان اللي غيرك يشوف فيه لا شي.", "أنت دليل إن البساطة لما تجي من شخص ذكي، تصير فن.", "عندك روح حرّة، والأرواح الحرّة ترسم طريقها بنفسها.", "لو كانت الفكرة الجيدة كنز، أنت عندك خريطته.", "أنت ما تخاف تكون مختلف، وهذا أجمل شي فيك.", "فيك ذكاء يخلّي أبسط الأشياء تقول أعمق الكلام.", "اختيارك يقول إنك شخص ممتع، وأي جلسة معك ما تنمل.", "عندك نظرة فنان معاصر: تشوف العالم كأنه معرض، وتستمتع فيه."] };
  var $ = function(id){ return document.getElementById(id); };
  var ar = function(n){ return Number(n).toLocaleString("ar-SA"); };
  var preview = /claude|localhost|^$|file:/.test(location.hostname + location.protocol);

  function store(v){ try{ if(v===undefined){ return JSON.parse(localStorage.getItem(STORE)||"null"); } localStorage.setItem(STORE, JSON.stringify(v)); }catch(e){ return null; } }

  function once(path, ms){
    var c = ("AbortController" in window) ? new AbortController() : null;
    var t = setTimeout(function(){ if(c) c.abort(); }, ms);
    var sep = path.indexOf("?") < 0 ? "?" : "&";
    return fetch(API + path + sep + "_=" + Date.now(), c ? {signal:c.signal} : {}).then(function(r){
      clearTimeout(t);
      if(r.status === 404) return {value:0};
      if(!r.ok) throw new Error("http " + r.status);
      return r.json();
    }).then(function(j){ return Number(j.value)||0; }, function(e){ clearTimeout(t); throw e; });
  }
  function req(path, retry){
    return once(path, 15000).catch(function(e){
      if(retry === false) throw e;
      return new Promise(function(res){ setTimeout(res, 1200); }).then(function(){ return once(path, 15000); });
    });
  }
  var KEY = { up: "vote-fawq", down: "vote-taht" };
  var hit = function(k){ return req("/hit/" + NS + "/" + KEY[k], false); };
  var get = function(k){ return req("/get/" + NS + "/" + KEY[k]); };

  // fixed shuffle so consecutive voters on the same side get different wisdom
  function perm(n, seed){
    var a=[], i; for(i=0;i<n;i++) a.push(i);
    var s = seed; function rnd(){ s = (s*1664525 + 1013904223) % 4294967296; return s/4294967296; }
    for(i=n-1;i>0;i--){ var j=Math.floor(rnd()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  var ORDER = { up: perm(WIS.up.length, 1447), down: perm(WIS.down.length, 2026) };
  function wisdomFor(side, rank){
    var list = WIS[side];
    var idx = rank > 0 ? ORDER[side][(rank-1) % list.length] : Math.floor(Math.random()*list.length);
    return { idx: idx, text: list[idx], total: list.length };
  }

  /* ---------- modes ---------- */
  var mode = location.hash.replace("#","");
  if(mode === "reset"){ try{ localStorage.removeItem(STORE); }catch(e){} history.replaceState(null,"",location.pathname); mode=""; }
  if(mode === "qr") return posterMode();
  if(mode === "live") return liveMode();

  var saved = store();
  if(saved && saved.side){ showResult(saved.side, saved.rank, saved.idx, true); }

  /* ---------- choose ---------- */
  var stage = $("stage"), sheet = $("sheet"), chosen = null;
  function open(side){
    chosen = side;
    stage.classList.remove("pick-up","pick-down"); stage.classList.add("pick-" + side);
    $("sheet-title").textContent = side === "up" ? "اخترت «فوق»" : "اخترت «تحت»";
    $("sheet-text").textContent = side === "up"
      ? "اللوحة المرسومة بتعب وإتقان. لكل شخص صوت واحد."
      : "الموزة والشريط اللاصق. لكل شخص صوت واحد.";
    sheet.classList.add("open"); 
    setTimeout(function(){ $("confirm").focus(); }, 300);
  }
  function close(){ sheet.classList.remove("open"); stage.classList.remove("pick-up","pick-down"); chosen = null; }
  $("pick-up").addEventListener("click", function(){ open("up"); });
  $("pick-down").addEventListener("click", function(){ open("down"); });
  $("cancel").addEventListener("click", close);
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") close(); });

  $("confirm").addEventListener("click", function(){
    if(!chosen) return;
    var side = chosen, b = $("confirm");
    b.disabled = true; b.textContent = "لحظة…";
    hit(side).then(function(rank){
      var w = wisdomFor(side, rank);
      store({side:side, rank:rank, idx:w.idx, at:Date.now()});
      showResult(side, rank, w.idx, false);
    }).catch(function(){
      var w = wisdomFor(side, 0);
      store({side:side, rank:0, idx:w.idx, at:Date.now()});
      showResult(side, 0, w.idx, false);
    });
  });

  /* ---------- result ---------- */
  function showResult(side, rank, idx, returning){
    document.body.className = "is-" + side;
    document.querySelector('meta[name=theme-color]').setAttribute("content", side === "up" ? "#120c07" : "#ddd5cb");
    $("stage").hidden = true; $("sheet").classList.remove("open"); $("sheet").hidden = true; $("result").hidden = false;
    window.scrollTo(0,0);
    var name = side === "up" ? "فوق" : "تحت";
    var list = WIS[side];
    $("r-wisdom").textContent = list[idx] || list[0];
    $("r-no").textContent = "رسالة " + ar(idx+1) + " من " + ar(list.length) + " · لمن اختار «" + name + "»";
    $("r-eyebrow").textContent = rank > 0 ? ("صوتك رقم " + ar(rank) + " في «" + name + "»") : ("اخترت «" + name + "»");
    $("tl-" + side).classList.add("mine");
    if(returning){ $("r-note").textContent = "صوّتَّ من قبل على هذا الجهاز. هذه نتيجتك، والأرقام محدّثة الآن."; }

    var safe = function(k){ return get(k).then(function(v){ return {ok:true, v:v}; }, function(){ return {ok:false, v:0}; }); };
    Promise.all([safe("up"), safe("down")]).then(function(res){
      if(!res[0].ok && !res[1].ok) throw new Error("offline");
      var up = Math.max(res[0].v, side==="up"?Math.max(rank,1):0), down = Math.max(res[1].v, side==="down"?Math.max(rank,1):0);
      if(rank <= 0){ $("r-eyebrow").textContent = "اخترت «" + name + "»"; }
      paint(side, up, down);
    }).catch(function(){
      if(preview){
        paint(side, side==="up"?128:96, side==="down"?128:96, true);
        $("r-note").textContent = "معاينة: هذه أرقام توضيحية. العدّاد الحقيقي يعمل بعد رفع الموقع على الإنترنت.";
      } else {
        $("r-n").textContent = "…";
        $("r-t").textContent = "تعذّر جلب عدد المصوّتين الآن";
        $("r-share").textContent = "صوتك وصل إن شاء الله. افتح الصفحة بعد قليل لترى الأرقام.";
        $("r-note").textContent = "";
      }
    });
  }

  function paint(side, up, down, demo){
    var total = up + down, mine = side === "up" ? up : down;
    var agree = Math.max(0, mine - 1);
    if(agree === 0){
      $("r-n").textContent = "الأول";
      $("r-t").textContent = "لم يسبقك أحد إلى «" + (side==="up"?"فوق":"تحت") + "». أنت من فتح الطريق.";
    } else {
      countUp($("r-n"), agree);
      $("r-t").textContent = agree === 1 ? "شخص واحد يتفق معك" : (agree === 2 ? "شخصان يتفقان معك" : (agree <= 10 ? "أشخاص يتفقون معك" : "شخصًا يتفقون معك"));
    }
    var pct = total ? Math.round(mine*100/total) : 100;
    $("r-share").textContent = pct === 50
      ? "نصف المصوّتين في صفّك. الكفّة متعادلة الآن."
      : pct > 50
      ? ar(pct) + "٪ من المصوّتين في صفّك. أنت مع الأغلبية."
      : ar(pct) + "٪ من المصوّتين في صفّك. رأيك أقلّ شيوعًا، وهذا لا يجعله أقلّ صوابًا.";
    $("v-up").textContent = ar(up); $("v-down").textContent = ar(down);
    requestAnimationFrame(function(){
      $("f-up").style.width = (total ? up*100/total : 50) + "%";
      $("f-down").style.width = (total ? down*100/total : 50) + "%";
    });
  }

  function countUp(el, to){
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reduce || to < 3){ el.textContent = ar(to); return; }
    var t0 = null, dur = Math.min(1800, 600 + to*8);
    function step(t){ if(!t0) t0 = t; var p = Math.min(1,(t-t0)/dur); var e = 1-Math.pow(1-p,3); el.textContent = ar(Math.round(to*e)); if(p<1) requestAnimationFrame(step); }
    requestAnimationFrame(step);
  }

  /* ---------- #qr : printable poster with this page's own address ---------- */
  function posterMode(){
    document.body.style.background = "var(--wall)";
    $("stage").hidden = true; $("poster").hidden = false;
    var url = location.href.split("#")[0];
    $("qr-url").textContent = url;
    var s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
    s.onload = function(){ new QRCode($("qr"), {text:url, width:600, height:600, colorDark:"#141210", colorLight:"#ffffff", correctLevel:QRCode.CorrectLevel.M}); };
    document.head.appendChild(s);
  }

  /* ---------- #live : big live tally for a screen beside the work ---------- */
  function liveMode(){
    $("stage").hidden = true; $("live").hidden = false;
    function tick(){
      Promise.all([get("up"), get("down")]).then(function(v){
        $("l-up").textContent = ar(v[0]); $("l-down").textContent = ar(v[1]);
        var t = v[0]+v[1]; $("l-fill").style.width = (t ? v[0]*100/t : 50) + "%";
      }).catch(function(){});
    }
    tick(); setInterval(tick, 5000);
  }
})();
</script>
