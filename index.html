<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<style>
/* Layout: an app of separate rooms. Home = name over a living Braille dot field + a bento index of rooms; each room (work, journey, skills, academic, certificates, contact) opens alone with its own header and a "next room" link. Teal = Makkah/clinical, ochre = Hajj badge, dots = the Braille graduation project. */
:root{
  --bg:#ECF1EF; --surface:#FFFFFF; --raised:#F6F9F8; --ink:#0F1C1B; --muted:#566563; --line:#D3DDDA;
  --teal:#0C5A55; --teal-2:#147A72; --teal-soft:#DCEDE9; --ochre:#B07614; --ochre-soft:#F4E8D2; --wa:#1B8A4D;
  --cover1:#0C5A55; --cover2:#14302D; --cover3:#B07614; --cover-fg:#F2F6F4;
  --dot:#B9C9C5; --dot-hot:#0C5A55;
  --display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1211; --surface:#111C1B; --raised:#152321; --ink:#E6EEEC; --muted:#8FA19E; --line:#22322F;
  --teal:#5CC1B4; --teal-2:#7BD3C7; --teal-soft:#153430; --ochre:#E3B057; --ochre-soft:#30271A; --wa:#4FCB86;
  --cover1:#10504A; --cover2:#0B1615; --cover3:#8C6116; --cover-fg:#E6EEEC; --dot:#22332F; --dot-hot:#5CC1B4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1211; --surface:#111C1B; --raised:#152321; --ink:#E6EEEC; --muted:#8FA19E; --line:#22322F;
  --teal:#5CC1B4; --teal-2:#7BD3C7; --teal-soft:#153430; --ochre:#E3B057; --ochre-soft:#30271A; --wa:#4FCB86;
  --cover1:#10504A; --cover2:#0B1615; --cover3:#8C6116; --cover-fg:#E6EEEC; --dot:#22332F; --dot-hot:#5CC1B4; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:1080px;margin-inline:auto}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;font-weight:500}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:8px}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
[dir="rtl"] .eyebrow{font-family:var(--body);letter-spacing:0;font-size:13px;font-weight:600}
.when{font-family:var(--mono);font-size:12px;color:var(--muted);direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}

/* ===== top bar ===== */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin-inline:auto;padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none;cursor:pointer;background:none;border:0;padding:0}
.brand .mk{width:34px;height:34px;border-radius:10px;background:var(--teal);color:var(--surface);display:grid;place-items:center;font-family:var(--display);font-size:18px;font-weight:600}
.brand .nm{font-family:var(--display);font-size:16px;font-weight:500;white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;justify-content:center}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:7px 12px;border-radius:999px;font-size:13.5px;color:var(--muted);white-space:nowrap;cursor:pointer;font-weight:500}
.tabs button[aria-current="page"]{color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.ctrl{display:flex;gap:6px;flex:none}
.icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:16px;height:16px}
.lang{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:none;padding:3px 10px;border-radius:999px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* ===== views ===== */
.view{padding-block:40px 24px}
.view.enter{animation:enter .45s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(14px)}}

/* ===== home ===== */
.hero{position:relative;border-radius:28px;overflow:hidden;background:var(--surface);border:1px solid var(--line);
  padding:clamp(28px,6vw,64px) clamp(20px,5vw,56px);display:grid;grid-template-columns:1fr auto;gap:32px;align-items:end;min-height:min(560px,78vh)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,var(--surface) 8%,color-mix(in srgb,var(--surface) 55%,transparent) 45%,transparent 80%)}
.hero>*:not(canvas){position:relative;z-index:1}
.hero-txt{min-width:0;display:flex;flex-direction:column;gap:18px}
.status{display:inline-flex;align-items:center;gap:9px;width:fit-content;background:var(--surface);border:1px solid var(--line);padding:6px 14px 6px 12px;border-radius:999px;font-size:13px;font-weight:600}
.status i{width:8px;height:8px;border-radius:50%;background:var(--wa);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--wa) 45%,transparent)}70%{box-shadow:0 0 0 8px transparent}}
.status span{color:var(--muted);font-weight:400}
.name{font-size:clamp(58px,13vw,148px);line-height:.95;font-weight:600;letter-spacing:-.01em}
.name span{display:block}
.name span+span{color:var(--teal)}
[dir="ltr"] .name{letter-spacing:-.03em}
.alt{font-family:var(--mono);font-size:12.5px;color:var(--muted);letter-spacing:.06em;direction:ltr;unicode-bidi:isolate}
[dir="ltr"] .alt{font-family:var(--body);letter-spacing:0;font-size:14px}
.roles{display:flex;flex-wrap:wrap;gap:6px}
.roles span{font-size:13px;padding:5px 12px;border-radius:999px;background:var(--teal-soft);color:var(--teal);font-weight:500}
.roles span:nth-child(3){background:var(--ochre-soft);color:var(--ochre)}
.pitch{max-width:54ch;margin:0;font-size:16px}
.cta{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;text-decoration:none;font-weight:600;font-size:14.5px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.wa{color:var(--wa)}
.btn:hover{border-color:var(--teal)}

.portrait{width:220px;flex:none;display:flex;flex-direction:column;gap:10px;align-items:center}
.arch{width:100%;aspect-ratio:4/5;max-width:100%;border-radius:22px;overflow:hidden;background:var(--teal);position:relative;display:grid;place-items:center;box-shadow:0 24px 48px -24px color-mix(in srgb,var(--ink) 55%,transparent);outline:1px solid color-mix(in srgb,var(--ink) 10%,transparent)}
.portrait{position:relative}
.portrait::before{content:"";position:absolute;inset:-14px -14px auto auto;width:100%;aspect-ratio:4/5;border:1.5px solid var(--ochre);border-radius:22px;z-index:-1}
[dir="rtl"] .portrait::before{inset:-14px auto auto -14px}
.arch img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.arch .mono{font-family:var(--display);font-size:92px;font-weight:600;color:var(--cover-fg);line-height:1}
.braille{display:flex;gap:10px;align-items:center;font-size:11.5px;color:var(--muted)}
.cell{display:grid;grid-template-columns:repeat(2,7px);gap:3px}
.cell i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.cell i.on{background:var(--teal)}

.index-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:44px 0 16px}
.index-head h2{font-size:clamp(24px,3.6vw,32px)}
.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:28px;min-height:170px;padding:20px;border-radius:22px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:start;overflow:hidden;transition:transform .25s,border-color .25s}
.tile:hover{transform:translateY(-3px);border-color:var(--teal)}
.tile h3{font-size:22px}
.tile p{margin:4px 0 0;color:var(--muted);font-size:13.5px;line-height:1.55}
.tile .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal)}
.tile .ic svg{width:22px;height:22px}
.tile .go{position:absolute;top:18px;inset-inline-end:18px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:15px;color:var(--muted);transition:.25s}
.tile:hover .go{background:var(--ink);color:var(--bg);border-color:var(--ink)}
[dir="ltr"] .tile .go{transform:scaleX(-1)}
.tile.big{grid-column:span 2;grid-row:span 2;background:var(--cover2);color:var(--cover-fg);border-color:transparent;justify-content:flex-end;min-height:352px}
.tile.big .art{position:absolute;inset:0}
.tile.big .art svg{width:100%;height:100%}
.tile.big::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(to top,var(--cover2) 25%,transparent 75%)}
.tile.big>*:not(.art){position:relative;z-index:2}
.tile.big h3{font-size:30px}
.tile.big p{color:color-mix(in srgb,var(--cover-fg) 75%,transparent);max-width:38ch}
.tile.big .go{border-color:color-mix(in srgb,var(--cover-fg) 35%,transparent);color:var(--cover-fg)}
.tile.wide{grid-column:span 2}
.tile.full{grid-column:1/-1;min-height:130px}
.tile.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tile.dark p{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.tile.dark .ic{background:color-mix(in srgb,var(--bg) 12%,transparent);color:var(--bg)}
.tile.dark .go{border-color:color-mix(in srgb,var(--bg) 30%,transparent);color:var(--bg)}
.tile.sand{background:var(--ochre-soft);border-color:transparent}
.tile.sand .ic{background:var(--surface);color:var(--ochre)}

/* ===== room header ===== */
.room-head{display:flex;flex-direction:column;gap:10px;margin-bottom:28px;max-width:720px}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);font-size:13.5px;cursor:pointer;padding:0;width:fit-content}
.back:hover{color:var(--ink)}
.room-head h2{font-size:clamp(38px,7vw,72px);line-height:1.02;font-weight:600}
.room-head p{margin:0;color:var(--muted);font-size:16px;max-width:60ch}
.next{margin-top:40px;display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;padding:22px 24px;border-radius:22px;border:1px dashed var(--line);background:none;cursor:pointer;text-align:start}
.next:hover{border-style:solid;border-color:var(--teal)}
.next small{display:block;color:var(--muted);font-size:12.5px}
.next b{font-family:var(--display);font-weight:500;font-size:clamp(22px,4vw,30px)}
.next .arr{font-size:26px;color:var(--teal)}
[dir="ltr"] .next .arr{transform:scaleX(-1)}

/* ===== work ===== */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.fbtn{border:1px solid var(--line);background:var(--surface);padding:7px 15px;border-radius:999px;font-size:13.5px;cursor:pointer}
.fbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;cursor:pointer;text-align:start;padding:0;transition:transform .25s,border-color .25s;min-width:0}
.card.wide{grid-column:1/-1}
.card:hover{transform:translateY(-3px);border-color:var(--teal)}
.card[hidden]{display:none}
.cover{aspect-ratio:16/10;max-width:100%;position:relative;overflow:hidden}
.card.wide .cover{aspect-ratio:21/8}
.cover svg{width:100%;height:100%;display:block;transition:transform .6s}
.card:hover .cover svg{transform:scale(1.04)}
.cover .badge{position:absolute;top:14px;inset-inline-start:14px;background:var(--cover-fg);color:var(--cover2);font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:999px}
.cbody{padding:18px 20px 20px;display:flex;flex-direction:column;gap:6px;flex:1}
.cbody h3{font-size:22px;line-height:1.3}
.cbody p{margin:0;color:var(--muted);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:10px}
.tags span{font-size:11.5px;padding:2px 10px;border-radius:999px;background:var(--raised);color:var(--muted);border:1px solid var(--line)}
.more{color:var(--teal);font-weight:600;font-size:13px;margin-top:4px}

/* ===== sheet (case + certificate) ===== */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,#000 50%,transparent);z-index:40;display:flex;justify-content:center;align-items:flex-end;padding-top:env(safe-area-inset-top,0px)}
.sheet{background:var(--surface);width:min(780px,100%);max-height:92vh;max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .35s cubic-bezier(.2,.7,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.3}}
@media (min-width:760px){.scrim{align-items:center}.sheet{border-radius:24px}}
.sheet .cover{aspect-ratio:21/9}
.sheet-in{padding:22px max(22px,env(safe-area-inset-left,0px)) 30px;display:flex;flex-direction:column;gap:16px}
.sheet h3{font-size:clamp(24px,4vw,32px)}
.close{position:sticky;top:12px;float:inline-end;margin:12px 12px -48px;z-index:2;width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);cursor:pointer;font-size:20px;line-height:1;box-shadow:0 2px 12px color-mix(in srgb,#000 25%,transparent)}
.kvs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kvs div{background:var(--raised);border-radius:12px;padding:10px 12px;min-width:0}
.kvs small{display:block;color:var(--muted);font-size:12px}
.kvs b{font-weight:600;font-size:14px}
.sheet h4{font-size:16px;color:var(--teal)}
.sheet ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.outcomes{display:flex;flex-wrap:wrap;gap:8px}
.outcomes div{border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-width:120px;flex:1}
.outcomes b{display:block;font-family:var(--display);font-size:26px;font-weight:500;color:var(--teal)}
.outcomes small{color:var(--muted);font-size:12.5px}
.note{background:var(--ochre-soft);border-radius:12px;padding:12px 14px;font-size:13.5px}
.viewer-img{width:100%;display:block;background:#fff}
.privacy{font-size:12.5px;color:var(--muted);margin:0}

/* ===== skills ===== */
.sk{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.sgroup{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sgroup h3{font-size:18px;display:flex;align-items:center;gap:10px}
.sgroup h3 i{width:10px;height:10px;border-radius:3px;background:var(--teal)}
.sgroup:nth-child(2) h3 i{background:var(--ochre)} .sgroup:nth-child(3) h3 i{background:var(--teal-2)} .sgroup:nth-child(4) h3 i{background:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--raised);padding:6px 13px;border-radius:999px;font-size:13.5px;cursor:pointer;line-height:1.35}
.chip[data-n]::after{content:attr(data-n);font-family:var(--mono);font-size:11px;margin-inline-start:7px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--surface)}
.chip[aria-pressed="true"]::after{color:var(--surface)}
.skill-note{margin-bottom:14px;background:var(--teal-soft);border-radius:14px;padding:12px 16px;font-size:14px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.skill-note button{border:0;background:none;color:var(--teal);font-weight:600;cursor:pointer;padding:0;text-decoration:underline}

/* ===== journey ===== */
.tl{position:relative;display:flex;flex-direction:column;gap:14px;padding-inline-start:28px}
.tl::before{content:"";position:absolute;inset-inline-start:7px;top:8px;bottom:8px;width:2px;background:var(--line);border-radius:1px}
.step{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:start}
.step::before{content:"";position:absolute;inset-inline-start:-27px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:3px solid var(--teal)}
.step.hajj::before{border-color:var(--ochre)} .step.edu::before{background:var(--teal)}
.step>div{min-width:0}
.step .kind{font-size:11.5px;font-weight:600;color:var(--teal);background:var(--teal-soft);padding:2px 9px;border-radius:999px;width:fit-content;margin-bottom:6px}
.step.hajj .kind{color:var(--ochre);background:var(--ochre-soft)}
.step h3{font-size:19px}
.step .org{color:var(--muted);font-size:14px}
.step .lk{border:0;background:none;padding:0;margin-top:6px;color:var(--teal);font-weight:600;font-size:13px;cursor:pointer}

/* ===== academic ===== */
.acad{display:grid;grid-template-columns:1.1fr 1fr;gap:14px}
.acad>div{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.panel h3{font-size:20px}
.panel .sub2{color:var(--muted);font-size:13.5px;margin:-8px 0 0}
.afacts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.afacts div{background:var(--raised);border-radius:12px;padding:10px 12px;min-width:0}
.afacts b{display:block;font-family:var(--display);font-weight:500;font-size:21px;color:var(--teal);font-variant-numeric:tabular-nums}
.afacts small{color:var(--muted);font-size:12px;line-height:1.35;display:block}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.chart .lbl{font-size:12px;fill:var(--ink);font-weight:500}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-inline-end:6px}
.courses{display:flex;flex-direction:column;gap:16px}
.cgroup h4{font-size:14px;color:var(--muted);margin:0 0 8px}
.crow{display:grid;grid-template-columns:1fr 44px;gap:4px 10px;align-items:center;font-size:14px;padding-block:5px}
.crow b{font-family:var(--mono);font-weight:500;font-size:13px;text-align:end;color:var(--teal);font-variant-numeric:tabular-nums}
.crow .bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--raised);overflow:hidden}
.crow .bar i{display:block;height:100%;background:var(--teal);border-radius:2px}
.crow.hi b{color:var(--ochre)} .crow.hi .bar i{background:var(--ochre)}

/* ===== certificates ===== */
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ccard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;text-align:start;padding:0;transition:transform .25s,border-color .25s;min-width:0}
.ccard:hover{transform:translateY(-3px) rotate(-.4deg);border-color:var(--teal)}
.ccard .thumb{aspect-ratio:4/3;max-width:100%;background:var(--raised);overflow:hidden;border-bottom:1px solid var(--line);position:relative}
.ccard .thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.ccard .thumb .kind{position:absolute;bottom:10px;inset-inline-start:10px;background:var(--ink);color:var(--bg);font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px}
.ccard .cb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:3px}
.ccard strong{font-weight:600;font-size:15px;line-height:1.45}
.ccard p{margin:0;color:var(--muted);font-size:13px}
.sub-h{font-size:24px;margin:36px 0 14px}
.langs{display:grid;grid-template-columns:1fr 1.4fr;gap:14px}
.langs>div{min-width:0}
.skillbar{display:grid;grid-template-columns:90px 1fr 30px;gap:10px;align-items:center;font-size:13.5px}
.skillbar .track{height:8px;display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.skillbar .track i{border-radius:3px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line)}
.skillbar .track i.on{background:var(--teal);box-shadow:none}
.skillbar b{font-family:var(--mono);font-weight:500;font-size:12.5px;color:var(--muted)}
.extra{margin:14px 0 0;display:grid;grid-template-columns:auto 1fr;gap:8px 20px;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.extra dt{color:var(--muted)} .extra dd{margin:0}

/* ===== contact ===== */
.contact{background:var(--ink);color:var(--bg);border-radius:28px;padding:clamp(24px,5vw,48px);display:flex;flex-direction:column;gap:26px;position:relative;overflow:hidden}
.contact h2{font-size:clamp(34px,6.5vw,64px);line-height:1.08;font-weight:600}
.contact h2 em{font-style:normal;color:var(--teal)}
.contact .lead{margin:0;color:color-mix(in srgb,var(--bg) 70%,transparent);max-width:56ch}
.clist{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.citem{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;padding:16px;border-radius:18px;background:color-mix(in srgb,var(--bg) 7%,transparent);border:1px solid color-mix(in srgb,var(--bg) 15%,transparent);min-width:0}
.citem .ic{grid-row:span 2;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 12%,transparent)}
.citem .ic svg{width:20px;height:20px}
.citem small{color:color-mix(in srgb,var(--bg) 62%,transparent);font-size:12px}
.citem .v{font-weight:600;direction:ltr;unicode-bidi:isolate;user-select:all;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
[dir="rtl"] .citem .v{text-align:right}
.btns{grid-column:1/-1;display:flex;gap:6px;margin-top:10px}
.mini{flex:1;text-align:center;border:1px solid color-mix(in srgb,var(--bg) 25%,transparent);background:none;color:var(--bg);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.mini.solid{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.contact .fine{margin:0;font-size:12.5px;color:color-mix(in srgb,var(--bg) 55%,transparent)}
.contact .dots{position:absolute;inset-inline-end:-20px;top:-20px;width:220px;height:220px;opacity:.18;pointer-events:none}

footer{text-align:center;color:var(--muted);font-size:12.5px;padding-top:28px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100% - 32px);text-align:center;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:900px){
  .tabs{justify-content:flex-start}
  .brand .nm{display:none}
  .bento{grid-template-columns:repeat(2,1fr)}
  .tile.big{grid-column:1/-1;grid-row:auto;min-height:300px}
  .acad,.langs{grid-template-columns:1fr}
  .cgrid{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
  .hero{grid-template-columns:1fr;min-height:0}
  .portrait{width:104px;order:-1;align-items:flex-start}
  .portrait .arch{border-radius:50%;aspect-ratio:1;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--teal)}
  .portrait::before{display:none}
  .portrait .braille{display:none}
  .portrait .arch img{object-position:50% 38%}
  .grid,.sk,.clist{grid-template-columns:1fr}
  .card.wide .cover{aspect-ratio:16/10}
  .cgrid{grid-template-columns:1fr}
  .afacts{grid-template-columns:1fr 1fr}
  .kvs{grid-template-columns:1fr 1fr}
  .tile{min-height:150px;gap:20px}
  .tile.wide{grid-column:1/-1}
  .step{grid-template-columns:1fr}
  .skillbar{grid-template-columns:76px 1fr 28px}
}
@media (max-width:400px){.bento{grid-template-columns:1fr}.tile.wide,.tile.big{grid-column:auto}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- drawn covers (one per project type) ---------- */
function cover(kind, id){
  const W=840, H=525;
  const bg = {braille:"var(--cover1)", rope:"var(--cover2)", flow:"var(--cover3)", slips:"var(--cover1)", ledger:"var(--cover2)"}[kind];
  let g="";
  if(kind==="braille"){
    // Braille cells; filled = raised dots. Each column pair is one letter.
    const pat="101100110010111010010110100111001011010011101100";
    let i=0;
    for(let r=0;r<5;r++) for(let c=0;c<14;c++){
      const cx=70+c*48+Math.floor(c/2)*16, cy=80+r*78;
      for(let d=0; d<3; d++){
        const on = pat[(i++)%pat.length]==="1";
        g+=`<circle cx="${cx}" cy="${cy+d*20}" r="${on?7:3}" fill="var(--cover-fg)" opacity="${on?0.95:0.25}"/>`;
      }
    }
    const hues=["#E0AE57","#5FC2B6","#E26D5A","#F2F4F3","#7A9CE0"];
    hues.forEach((h,k)=>g+=`<rect x="${640+k*30}" y="440" width="22" height="22" rx="5" fill="${h}"/>`);
  }
  if(kind==="rope"){
    g+=`<rect x="0" y="${H/2}" width="${W}" height="${H/2}" fill="var(--cover3)" opacity=".35"/>`;
    // painted bowl top
    g+=`<path d="M300 175 Q420 250 540 175 Z" fill="none" stroke="var(--cover-fg)" stroke-width="3"/>`;
    [[350,160,26],[395,150,30],[445,155,28],[490,165,24]].forEach(([x,y,r])=>g+=`<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="var(--cover-fg)" stroke-width="2.5"/>`);
    // rope: clean above, frayed below
    g+=`<path d="M420 215 C440 260 400 300 420 350" stroke="var(--cover-fg)" stroke-width="3" fill="none"/>`;
    g+=`<path d="M420 350 C436 380 404 410 424 440" stroke="var(--cover-fg)" stroke-width="3" fill="none" stroke-dasharray="6 7" opacity=".8"/>`;
    // banana + tape below
    g+=`<path d="M372 452 Q420 490 470 450" stroke="#E0AE57" stroke-width="16" fill="none" stroke-linecap="round"/>`;
    g+=`<rect x="408" y="455" width="34" height="14" fill="var(--cover-fg)" opacity=".85" transform="rotate(-18 425 462)"/>`;
    g+=`<text x="760" y="90" fill="var(--cover-fg)" font-family="Readex Pro" font-size="34" font-weight="500">↑</text><text x="760" y="${H-50}" fill="var(--cover-fg)" font-family="Readex Pro" font-size="34" font-weight="500">↓</text>`;
  }
  if(kind==="flow"){
    for(let k=0;k<11;k++){
      const y0=40+k*44, spread=(k-5)*44;
      g+=`<path d="M0 ${y0} C 300 ${y0}, 360 ${H/2+spread*0.18}, 470 ${H/2+spread*0.18} S 700 ${H/2+spread*0.9}, ${W} ${H/2+spread*0.9}" fill="none" stroke="var(--cover-fg)" stroke-width="2" opacity="${0.35+0.06*(5-Math.abs(k-5))}"/>`;
    }
    g+=`<rect x="455" y="${H/2-70}" width="10" height="140" fill="var(--cover-fg)"/><rect x="475" y="${H/2-70}" width="10" height="140" fill="var(--cover-fg)"/>`;
  }
  if(kind==="slips"){
    for(let k=0;k<5;k++){
      const x=170+k*105, y=110+(k%2)*30, rot=(k-2)*4;
      g+=`<g transform="rotate(${rot} ${x+70} ${y+150})"><rect x="${x}" y="${y}" width="150" height="300" rx="6" fill="var(--cover-fg)" opacity="${0.55+k*0.1}"/>`;
      for(let l=0;l<8;l++) g+=`<rect x="${x+18}" y="${y+30+l*26}" width="${l%3===2?60:114}" height="6" rx="3" fill="var(--cover1)" opacity=".5"/>`;
      g+=`<rect x="${x+18}" y="${y+252}" width="114" height="20" rx="4" fill="var(--cover3)"/></g>`;
    }
  }
  if(kind==="ledger"){
    for(let r=0;r<9;r++) for(let c=0;c<6;c++){
      const filled=(r*7+c*3)%5!==0;
      g+=`<rect x="${70+c*118}" y="${50+r*48}" width="${c===0?60:104}" height="28" rx="4" fill="var(--cover-fg)" opacity="${filled?0.14+((r+c)%3)*0.08:0}" stroke="var(--cover-fg)" stroke-opacity=".25"/>`;
    }
    g+=`<rect x="70" y="${50+4*48}" width="694" height="28" rx="4" fill="none" stroke="#E0AE57" stroke-width="3"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="${W}" height="${H}" fill="${bg}"/>${g}</svg>`;
}

/* ---------- Braille dot field (home hero) ---------- */
let raf=0, fieldObs=null;
function stopField(){ cancelAnimationFrame(raf); raf=0; if(fieldObs){fieldObs.disconnect(); fieldObs=null;} }
function startField(){
  const cv=$("#field"), hero=$("#hero"); if(!cv) return;
  const ctx=cv.getContext("2d"); const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W=0,H=0,dots=[],px=-999,py=-999,last=0,col={};
  const GAP=22;
  function colors(){ const cs=getComputedStyle(document.documentElement); col={d:cs.getPropertyValue("--dot").trim(),h:cs.getPropertyValue("--dot-hot").trim(),o:cs.getPropertyValue("--ochre").trim()}; }
  function layout(){
    const r=hero.getBoundingClientRect(), dpr=Math.min(2,devicePixelRatio||1);
    W=r.width; H=r.height; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const cols=Math.ceil(W/GAP)+1, rows=Math.ceil(H/GAP)+1; dots=[];
    const raised=new Set();
    // write HUSSAM / FODAH in Braille near the top, toward the side opposite the text start
    const words=["HUSSAM","FODAH"], rtl=document.documentElement.dir==="rtl";
    words.forEach((w,wi)=>{ const len=w.length*3-1; const c0=rtl?2:Math.max(2,cols-len-3); const r0=2+wi*4;
      [...w].forEach((ch,k)=>{ BR[ch].forEach(n=>{ const cc=c0+k*3+(n>3?1:0), rr=r0+((n-1)%3); raised.add(cc+","+rr); }); }); });
    for(let j=0;j<rows;j++) for(let i=0;i<cols;i++) dots.push({x:i*GAP+GAP/2,y:j*GAP+GAP/2,r:raised.has(i+","+j)});
  }
  function frame(t){
    ctx.clearRect(0,0,W,H);
    for(const d of dots){
      const dx=d.x-px, dy=d.y-py, dist=Math.sqrt(dx*dx+dy*dy);
      let b=Math.max(0,1-dist/130); b=b*b;
      const wave=reduce?0:Math.pow(Math.max(0,Math.sin(t*0.0009+d.x*0.011-d.y*0.006)),14)*0.55;
      const k=Math.max(b,wave);
      const rad=(d.r?3.6:1.5)+k*3.2;
      ctx.beginPath(); ctx.arc(d.x,d.y,rad,0,6.283);
      ctx.fillStyle=d.r?col.h:col.d; ctx.globalAlpha=d.r?0.9:1; ctx.fill();
      if(k>0.04&&!d.r){ ctx.globalAlpha=k; ctx.fillStyle=col.h; ctx.fill(); }
    }
    ctx.globalAlpha=1;
    if(!reduce) raf=requestAnimationFrame(frame);
  }
  colors(); layout(); frame(0);
  hero.addEventListener("pointermove",e=>{const r=hero.getBoundingClientRect(); px=e.clientX-r.left; py=e.clientY-r.top; if(reduce) frame(0);});
  hero.addEventListener("pointerleave",()=>{px=py=-999; if(reduce) frame(0);});
  if("ResizeObserver" in window){ fieldObs=new ResizeObserver(()=>{layout(); if(reduce) frame(0);}); fieldObs.observe(hero); }
  startField.recolor=()=>{colors(); if(reduce) frame(0);};
}

  const f=t.closest("[data-filter]"); if(f){filter=f.dataset.filter;document.querySelectorAll("[data-filter]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.filter===filter));applyFilter();return;}
  const s=t.closest("[data-skill]"); if(s){activeSkill=activeSkill===s.dataset.skill?null:s.dataset.skill;document.querySelectorAll("[data-skill]").forEach(c=>c.setAttribute("aria-pressed",c.dataset.skill===activeSkill));updateSkillNote();return;}
  if(t.closest("[data-clear-skill]")){activeSkill=null;document.querySelectorAll("[data-skill]").forEach(c=>c.setAttribute("aria-pressed","false"));updateSkillNote();return;}
  if(t.closest("[data-save]")){saveContact();return;}
  const c=t.closest("[data-copy]"); if(c){copyText(c.dataset.copy,c);return;}
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!$("#scrim").hidden) closeCase(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>{ startField.recolor&&startField.recolor(); shell(); });
